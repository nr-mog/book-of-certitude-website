name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-dependencies: true

      # Drives the rendered deck through reveal.js's own ?print-pdf stylesheet,
      # so the PDF is the web slides printed rather than a separate export.
      #
      # continue-on-error: the PDF is an optional download. If this breaks, the
      # site should still deploy — only the PDF link goes missing.
      - name: Export slides and handouts to PDF
        continue-on-error: true
        run: |
          set -x
          python3 -m http.server 8080 --directory _site &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ >/dev/null && break
            sleep 1
          done

          # Only decks offered as a download need a PDF. The per-week decks
          # are presented live from the site, so exporting all of them would
          # add ~12 near-empty PDFs and minutes to every push. Add a name here
          # to start exporting it.
          for name in intro; do
            chrome --headless=new --disable-gpu --no-sandbox --hide-scrollbars \
              --virtual-time-budget=20000 \
              --run-all-compositor-stages-before-draw \
              --no-pdf-header-footer \
              --print-to-pdf="_site/slides/$name.pdf" \
              "http://localhost:8080/slides/$name.html?print-pdf" || true
          done

          # Each week handout, printed from the page itself so the PDF cannot
          # drift from the web version. The @media print rules in styles.scss
          # are what shape it: navigation, note boxes and the download button
          # itself drop out, and the passage text takes the full width. The
          # long virtual-time budget is for the pages that build their
          # paragraphs from data/ at load.
          for n in $(seq -w 1 13); do
            chrome --headless=new --disable-gpu --no-sandbox --hide-scrollbars \
              --virtual-time-budget=25000 \
              --run-all-compositor-stages-before-draw \
              --no-pdf-header-footer \
              --print-to-pdf="_site/weeks/week-$n.pdf" \
              "http://localhost:8080/weeks/week-$n.html" || true
          done

          ls -l _site/slides/ _site/weeks/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
