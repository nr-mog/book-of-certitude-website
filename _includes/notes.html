<script>
/* ---------------------------------------------------------------------------
   Personal notes, stored in this browser only.

   Notes are keyed by paragraph number, so the same note follows a paragraph
   wherever it appears. Nothing is transmitted anywhere.

   Storage is localStorage rather than cookies: cookies cap at ~4KB and are
   sent with every request. Be aware that iOS Safari can evict script-writable
   storage after seven days without a visit, which is why export is prominent.
--------------------------------------------------------------------------- */
(function () {
  'use strict';

  var KEY = 'iqan:note:';
  var LINKS = null;
  var FOOTNOTES = null;
  // Quarto emits this as "./" at the site root and "../" one level down, so
  // data/ resolves correctly from both index.html and weeks/week-03.html.
  var offset = document.querySelector('meta[name="quarto:offset"]');
  var BASE = (offset && offset.content) || './';

  function load(n) {
    try { return localStorage.getItem(KEY + n) || ''; } catch (e) { return ''; }
  }
  function save(n, value) {
    try {
      if (value.trim() === '') localStorage.removeItem(KEY + n);
      else localStorage.setItem(KEY + n, value);
      return true;
    } catch (e) { return false; }
  }
  function allNotes() {
    var out = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(KEY) === 0) {
          var n = parseInt(k.slice(KEY.length), 10);
          if (!isNaN(n)) out.push({ n: n, text: localStorage.getItem(k) });
        }
      }
    } catch (e) {}
    return out.sort(function (a, b) { return a.n - b.n; });
  }

  // Every digit run in the Book is a footnote marker - checked against the
  // text, all 182 of them, and none is an ordinary numeral. So the rule is
  // simply: a run of 1-3 digits that names a known footnote is a marker.
  //
  // An earlier version required the digits to follow a non-space character,
  // to protect numerals that turned out not to exist. That guard broke the
  // paired markers in ¶54 ("…Mosque."38, 39 …"), where the second is preceded
  // by a space and was being split into "3" + a spurious marker "9".
  function isMarker(num) {
    return num.length <= 3 && FOOTNOTES && FOOTNOTES[num];
  }

  // Stripped, for the AI prompt - bare numbers mid-sentence only confuse it.
  function clean(t) {
    return String(t).replace(/\d+/g, function (num) {
      return isMarker(num) ? '' : num;
    });
  }

  function esc(t) {
    return String(t).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // Built segment by segment rather than by escaping first and then swapping
  // in the markers: HTML entities contain digits of their own (&#39;), and a
  // second pass over escaped text would mistake those for footnote numbers.
  function renderTextHTML(t) {
    var s = String(t), out = '', last = 0;
    s.replace(/\d+/g, function (num, idx) {
      out += esc(s.slice(last, idx));
      out += isMarker(num)
        ? '<sup class="fn-ref" data-fn="' + num + '" role="button" tabindex="0" ' +
          'aria-label="Footnote ' + num + '">' + num + '</sup>'
        : esc(num);
      last = idx + num.length;
      return num;
    });
    return out + esc(s.slice(last));
  }

  function fetchJSON(path) {
    return fetch(BASE + path, { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
  }

  var debounce = function (fn, ms) {
    var t; return function () {
      var a = arguments, self = this;
      clearTimeout(t); t = setTimeout(function () { fn.apply(self, a); }, ms);
    };
  };


  /* --- "Ask about this paragraph" ---------------------------------------
     Deep links are unreliable for this audience: claude://claude.ai/new?q=
     needs the desktop app, the mobile scheme opens the Code tab, and
     https://claude.ai/new?q= is not a documented parameter. Copying to the
     clipboard works on every device and with any assistant, so that is the
     primary action and the links are just somewhere to paste.
  --------------------------------------------------------------------- */
  var IQAN_URL = 'https://www.bahai.org/library/authoritative-texts/bahaullah/kitab-i-iqan/';

  function buildPrompt(n, text) {
    var lines = [
      "I'm studying the Kitáb-i-Íqán (the Book of Certitude) by Bahá'u'lláh. I'm looking at paragraph " + n + ".",
      ''
    ];
    if (text) {
      lines.push('Here is the passage:', '', '"""', clean(text), '"""', '');
    } else {
      lines.push('You can find the text at ' + IQAN_URL + ' — paragraph ' + n + '.', '');
    }
    lines.push(
      'Please help me answer the following question. in the Bahá\u2019í Writings authoritative interpretation belongs only to ' +
      '\u02bbAbdu\u2019l-Bahá and Shoghi Effendi. I want help reading the text for myself, ' +
      'not conclusions handed to me.' + 'Question:'
    );
    return lines.join('\n');
  }

  function copyText(str) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(str);
    }
    // Fallback for browsers without the async clipboard API
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = str;
      ta.setAttribute('readonly', '');
      ta.style.position = 'absolute';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      ok ? resolve() : reject();
    });
  }

  // The passage as plain text, with the footnote numbers taken out - read
  // from the DOM so the prompt works for pre-rendered rows too.
  function passageText(wrap) {
    var el = wrap.querySelector('.note-text');
    if (!el) return '';
    var copy = el.cloneNode(true);
    [].slice.call(copy.querySelectorAll('sup.fn-ref')).forEach(function (sup) {
      sup.parentNode.removeChild(sup);
    });
    return copy.textContent.trim();
  }

  function wireAsk(wrap, n) {
    var box  = wrap.querySelector('.note-ask');
    var send = wrap.querySelector('.send-btn');
    var btn  = wrap.querySelector('.ask-btn:not(.send-btn)');
    if (!box || !send || !btn) return;

    // Hands the note to the Ask form via sessionStorage rather than a query
    // string: notes are private, and a URL would put them in browser history.
    send.addEventListener('click', function () {
      var note = (load(n) || '').trim();
      if (!note) {
        send.textContent = 'Write a note first';
        setTimeout(function () { send.textContent = 'Send as question'; }, 2200);
        return;
      }
      try {
        sessionStorage.setItem('iqan:ask', JSON.stringify({
          question: note,
          reference: 'Paragraph ' + n
        }));
      } catch (e) {}
      window.location.href = BASE + 'ask.html';
    });

    var timer;
    btn.addEventListener('click', function () {
      copyText(buildPrompt(n, passageText(wrap))).then(function () {
        box.classList.add('copied');
        clearTimeout(timer);
        timer = setTimeout(function () { box.classList.remove('copied'); }, 12000);
      }).catch(function () {
        btn.textContent = 'Could not copy — select the text manually';
      });
    });
  }

  /* --- part divisions and the opening invocation --------------------------
     Rendered wherever the relevant paragraph appears, so they show on the
     Read page and on the week pages that contain those paragraphs.
  --------------------------------------------------------------------- */
  var STRUCTURE = {
    before: {
      1:   [['part-label', 'Part One'],
            ['invocation', 'IN THE NAME OF OUR LORD, THE EXALTED, THE MOST HIGH.']],
      102: [['part-label', 'Part Two']]
    },
    after: {
      101: [['part-end', 'END OF PART ONE']],
      290: [['part-end', 'END']]
    }
  };

  function structure(where, n, host) {
    var specs = STRUCTURE[where][n];
    if (!specs) return;
    specs.forEach(function (spec) {
      var el = document.createElement('div');
      el.className = 'struct ' + spec[0];
      el.textContent = spec[1];
      host.appendChild(el);
    });
  }

  /* --- one paragraph row -------------------------------------------------
     The Read page ships its rows in the HTML (see tools/gen_read.py) so the
     browser can resolve #p102 on first layout. buildRow produces the same
     markup for the pages that still assemble rows at runtime; keep the two
     in step.
  --------------------------------------------------------------------- */
  var ASK_TARGETS =
    '<span class="ask-targets">' +
    '<span class="ask-copied">Prompt copied — paste it into</span>' +
    '<a href="https://claude.ai/new" target="_blank" rel="noopener">Claude</a>' +
    '<a href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT</a>' +
    '<a href="https://gemini.google.com/app" target="_blank" rel="noopener">Gemini</a>' +
    '</span>';

  function buildRow(n, text) {
    var wrap = document.createElement('div');
    wrap.className = 'note-row';
    wrap.id = 'p' + n;

    var target = LINKS && LINKS.links && LINKS.links[String(n)];
    var num = target
      ? '<a class="note-num" href="' + LINKS.base + target + '" target="_blank" ' +
        'rel="noopener" title="Read paragraph ' + n + ' on bahai.org">' + n + '</a>'
      : '<span class="note-num">' + n + '</span>';

    wrap.innerHTML =
      '<div class="note-main">' +
        '<div class="note-head">' + num + '</div>' +
        (text ? '<div class="note-text">' + renderTextHTML(text) + '</div>' : '') +
      '</div>' +
      '<aside class="note-side">' +
        '<textarea class="note-input" rows="2" aria-label="Your note on paragraph ' + n + '" ' +
        'placeholder="Your note on paragraph ' + n + '…"></textarea>' +
        '<div class="note-bar"><span class="note-saved"></span></div>' +
        '<div class="note-ask">' +
          '<button type="button" class="ask-btn send-btn">Send as question</button>' +
          '<button type="button" class="ask-btn">Ask AI about this paragraph</button>' +
          ASK_TARGETS +
        '</div>' +
      '</aside>';
    return wrap;
  }

  function wireRow(wrap, n) {
    var ta   = wrap.querySelector('.note-input');
    var flag = wrap.querySelector('.note-saved');
    if (!ta) return wrap;

    ta.value = load(n);
    if (ta.value) {
      wrap.classList.add('has-note');
      ta.style.height = 'auto';
      ta.style.height = Math.max(ta.scrollHeight, 44) + 'px';
    }

    var commit = debounce(function () {
      var ok = save(n, ta.value);
      flag.textContent = ok ? 'Saved' : 'Could not save';
      flag.className = 'note-saved show' + (ok ? '' : ' err');
      wrap.classList.toggle('has-note', ta.value.trim() !== '');
      setTimeout(function () { flag.className = 'note-saved'; }, 1600);
    }, 550);

    ta.addEventListener('input', function () {
      ta.style.height = 'auto';
      ta.style.height = Math.max(ta.scrollHeight, 44) + 'px';
      commit();
    });

    wireAsk(wrap, n);
    return wrap;
  }

  function row(n, text) {
    return wireRow(buildRow(n, text), n);
  }

  /* --- render the paragraph range on a week page -------------------------- */
  function renderRange(host, from, to, texts, label) {
    if (from == null || to == null) {
      host.innerHTML = label
        ? '<p class="note-empty">This session has no assigned reading — it is ' + label +
          '. You can still add a note against any paragraph from the ' +
          '<a href="' + BASE + 'notes.html">My notes</a> page.</p>'
        : '<p class="note-empty">The paragraph range for this session has not been set yet. ' +
          'Once it is, note boxes for each paragraph will appear here.</p>';
      return;
    }
    var frag = document.createDocumentFragment();
    for (var n = from; n <= to; n++) {
      structure('before', n, frag);
      frag.appendChild(row(n, texts[String(n)]));
      structure('after', n, frag);
    }
    host.innerHTML = '';
    host.appendChild(frag);
  }

  /* --- export / import --------------------------------------------------- */
  function weekOf(n, weeks) {
    for (var i = 0; i < weeks.length; i++) {
      var w = weeks[i];
      if (w.from != null && n >= w.from && n <= w.to) return w;
    }
    return null;
  }

  function toMarkdown(weeks) {
    var notes = allNotes();
    if (!notes.length) return '# My notes on the Kitáb-i-Íqán\n\n*No notes yet.*\n';
    var out = ['# My notes on the Kitáb-i-Íqán', ''];
    var lastWeek = undefined;
    notes.forEach(function (item) {
      var w = weekOf(item.n, weeks);
      var label = w ? 'Week ' + w.week + ' — ' + w.date : 'Unassigned paragraphs';
      if (label !== lastWeek) { out.push('## ' + label, ''); lastWeek = label; }
      out.push('**Paragraph ' + item.n + '**', '', item.text, '');
    });
    return out.join('\n');
  }

  function download(name, text, type) {
    var blob = new Blob([text], { type: type });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  /* --- the My notes page ------------------------------------------------- */
  function renderAll(host, weeks, texts) {
    var notes = allNotes();
    var count = document.getElementById('notes-count');
    if (count) {
      count.textContent = notes.length === 0 ? 'No notes saved yet.'
        : notes.length === 1 ? '1 note saved.'
        : notes.length + ' notes saved.';
    }
    if (!notes.length) {
      host.innerHTML = '<p class="note-empty">Nothing saved yet. Open a week from the ' +
        '<a href="' + BASE + 'schedule.html">schedule</a> and write a note on a paragraph.</p>';
      return;
    }
    host.innerHTML = '';
    var lastWeek;
    notes.forEach(function (item) {
      var w = weekOf(item.n, weeks);
      var label = w ? 'Week ' + w.week : 'Unassigned';
      if (label !== lastWeek) {
        var h = document.createElement('h3');
        h.className = 'notes-group';
        h.textContent = w ? 'Week ' + w.week + ' · ' + w.date : 'Unassigned paragraphs';
        host.appendChild(h);
        lastWeek = label;
      }
      host.appendChild(row(item.n, texts[String(item.n)]));
    });
  }

  /* --- footnote popover -------------------------------------------------- */
  var pop = null;

  function closePop() {
    if (pop) { pop.remove(); pop = null; }
  }

  function openPop(el) {
    closePop();
    var num = el.getAttribute('data-fn');
    var body = FOOTNOTES && FOOTNOTES[num];
    pop = document.createElement('div');
    pop.className = 'fn-pop';
    pop.setAttribute('role', 'dialog');
    pop.innerHTML =
      '<span class="fn-pop-num">' + esc(num) + '</span>' +
      '<span class="fn-pop-body">' + esc(body || 'This footnote is not recorded.') + '</span>' +
      '<button type="button" class="fn-pop-close" aria-label="Close">&times;</button>';
    document.body.appendChild(pop);

    // Position under the marker, nudged to stay on screen.
    var r = el.getBoundingClientRect();
    var w = pop.offsetWidth;
    var left = r.left + window.scrollX + r.width / 2 - w / 2;
    left = Math.max(10, Math.min(left, window.scrollX + document.documentElement.clientWidth - w - 10));
    pop.style.left = left + 'px';
    pop.style.top = (r.bottom + window.scrollY + 8) + 'px';

    pop.querySelector('.fn-pop-close').addEventListener('click', closePop);
  }

  document.addEventListener('click', function (ev) {
    var ref = ev.target.closest && ev.target.closest('.fn-ref');
    if (ref) { ev.preventDefault(); openPop(ref); return; }
    if (pop && !ev.target.closest('.fn-pop')) closePop();
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') closePop();
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList &&
        ev.target.classList.contains('fn-ref')) {
      ev.preventDefault(); openPop(ev.target);
    }
  });
  window.addEventListener('resize', closePop);

  /* --- wire up on load --------------------------------------------------- */
  document.addEventListener('DOMContentLoaded', function () {
    var weekHost = document.getElementById('paragraph-notes');
    var allHost  = document.getElementById('all-notes');
    var readHost = document.getElementById('read-text');
    if (!weekHost && !allHost && !readHost) return;

    Promise.all([
      fetchJSON('data/weeks.json'),
      fetchJSON('data/iqan_full_text.json'),
      fetchJSON('data/paragraph-links.json'),
      fetchJSON('data/footnotes.json')
    ]).then(function (res) {
        FOOTNOTES = (res[3] && res[3].notes) || null;
        var weeks = (res[0] && res[0].weeks) || [];
        // Flat { "27": "text", ... } map of the whole Book.
        var texts = res[1] || {};
        LINKS = res[2] || null;

        if (weekHost) {
          var wk = parseInt(weekHost.getAttribute('data-week'), 10);
          var w = weeks.filter(function (x) { return x.week === wk; })[0] || {};
          renderRange(weekHost, w.from, w.to, texts, w.label);
        }

        if (readHost) {
          // Rows are in the HTML already, so the browser resolves any #pN
          // anchor on its first layout pass - there is nothing to build.
          [].slice.call(readHost.querySelectorAll('.note-row')).forEach(function (wrap) {
            var n = parseInt(wrap.id.slice(1), 10);
            if (!isNaN(n)) wireRow(wrap, n);
          });

          // One correction, for the cold-cache case only. The serif face
          // arrives after first paint and reflows 290 paragraphs, which leaves
          // the scroll offset pointing at the wrong place. Once the font is
          // cached there is no reflow and this is a no-op.
          if (location.hash && /^#p\d+$/.test(location.hash) &&
              document.fonts && document.fonts.ready) {
            var hash = location.hash;
            document.fonts.ready.then(function () {
              var el = document.getElementById(hash.slice(1));
              if (!el) return;
              var off = el.getBoundingClientRect().top;
              // Only act if the font swap actually moved things.
              if (Math.abs(off - 80) < 6) return;
              history.replaceState(null, '', location.pathname + location.search);
              location.hash = hash;
            });
          }
        }

        if (allHost) {
          renderAll(allHost, weeks, texts);

          var addForm = document.getElementById('add-note-form');
          if (addForm) addForm.addEventListener('submit', function (ev) {
            ev.preventDefault();
            var numEl = document.getElementById('add-note-num');
            var txtEl = document.getElementById('add-note-text');
            var status = document.getElementById('add-note-status');
            var n = parseInt(numEl.value, 10);
            var text = txtEl.value.trim();

            if (isNaN(n) || n < 1 || n > 290) {
              status.className = 'form-status err';
              status.textContent = 'Give a paragraph number between 1 and 290.';
              return;
            }
            if (!text) {
              status.className = 'form-status err';
              status.textContent = 'Write the note itself before adding it.';
              return;
            }

            // Never overwrite silently - append to whatever is already there.
            var existing = (load(n) || '').trim();
            var merged = existing ? existing + '\n\n' + text : text;
            if (!save(n, merged)) {
              status.className = 'form-status err';
              status.textContent = 'Could not save - this browser may be blocking storage.';
              return;
            }

            status.className = 'form-status ok';
            status.textContent = existing
              ? 'Added to your existing note on paragraph ' + n + '.'
              : 'Note saved on paragraph ' + n + '.';
            txtEl.value = '';
            numEl.value = '';
            renderAll(allHost, weeks, texts);
          });

          var ex = document.getElementById('export-md');
          if (ex) ex.addEventListener('click', function () {
            download('iqan-notes.md', toMarkdown(weeks), 'text/markdown');
          });

          var ej = document.getElementById('export-json');
          if (ej) ej.addEventListener('click', function () {
            download('iqan-notes.json', JSON.stringify({ notes: allNotes() }, null, 2),
                     'application/json');
          });

          var imp = document.getElementById('import-json');
          if (imp) imp.addEventListener('change', function () {
            var f = imp.files && imp.files[0];
            if (!f) return;
            var reader = new FileReader();
            reader.onload = function () {
              var status = document.getElementById('import-status');
              try {
                var data = JSON.parse(reader.result);
                var list = data.notes || [];
                var added = 0;
                list.forEach(function (item) {
                  if (typeof item.n === 'number' && typeof item.text === 'string') {
                    var existing = load(item.n);
                    // Never silently discard a note already here.
                    save(item.n, existing && existing !== item.text
                      ? existing + '\n\n---\n\n' + item.text
                      : item.text);
                    added++;
                  }
                });
                status.className = 'form-status ok';
                status.textContent = 'Imported ' + added + ' note' + (added === 1 ? '' : 's') +
                  '. Where a note already existed, the imported text was appended.';
                renderAll(allHost, weeks, texts);
              } catch (e) {
                status.className = 'form-status err';
                status.textContent = 'That file could not be read as notes JSON.';
              }
            };
            reader.readAsText(f);
          });

          var clr = document.getElementById('clear-notes');
          if (clr) clr.addEventListener('click', function () {
            var n = allNotes().length;
            if (!n) return;
            if (!confirm('Delete all ' + n + ' notes from this browser? ' +
                         'This cannot be undone — export them first if you want a copy.')) return;
            allNotes().forEach(function (item) { save(item.n, ''); });
            renderAll(allHost, weeks, texts);
          });
        }
      });
  });
})();
</script>
