project:
  type: website
  output-dir: _site
  resources:
    - data/
  render:
    - "*.qmd"
    - "slides/*.qmd"
    - "weeks/*.qmd"

website:
  title: "Kitáb-i-Íqán Study"
  description: "A fourteen-week study of Bahá'u'lláh's Book of Certitude."
  site-url: "https://nr-mog.github.io/book-of-certitude-website"
  favicon: assets/favicon.png
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: read.qmd
        text: Read
      - href: schedule.qmd
        text: Schedule
      - href: context.qmd
        text: Context
      - href: summary.qmd
        text: Summary
      - href: glossary.qmd
        text: Glossary
      - href: people.qmd
        text: People
      - text: Slides
        href: slides/intro.qmd
      - href: ask.qmd
        text: Ask
      - href: notes.qmd
        text: My notes
  page-footer:
    center: |
      "Blessed is he that hath beheld it and pondered its contents for the love of God, the Lord of creation."
    border: false

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    toc-title: On this page
    anchor-sections: true
    link-external-newwindow: true
    smooth-scroll: true
    grid:
      sidebar-width: 240px
      body-width: 820px
      margin-width: 260px
    include-after-body:
      - _includes/notes.html
